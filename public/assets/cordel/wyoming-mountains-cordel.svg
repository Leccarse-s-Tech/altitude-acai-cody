<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" fill="none" role="img" aria-labelledby="wyoming-cordel-title">
  <title id="wyoming-cordel-title">Cody, Wyoming Absaroka Mountain Peaks, Natural Sun with Organic Clouds, Pines, and Acai Flora in Cordel Woodcut Style</title>

