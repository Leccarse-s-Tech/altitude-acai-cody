<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" fill="none" role="img" aria-labelledby="toppings-honey-title">
  <title id="toppings-honey-title">Cordel Woodcut Engravings of Acai Bowl, Honey Dipper with Honeycomb, Granola Clusters, Coconut Shavings, Pumpkin Seeds, and Almonds</title>
  <defs>
    <pattern id="topping-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1E2749" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- Transparent canvas for frameless background integration -->
  <g id="toppings-honey-specimens">

  <!-- 1. LAYERED ACAI BOWL CARVING (x ~ 165) -->
  <g id="woodcut-acai-bowl" transform="translate(165, 178)">
    <!-- Carved spoon bowl + handle emerging cleanly -->
    <ellipse cx="104" cy="-92" rx="18" ry="11" transform="rotate(-44 104 -92)" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.8" />
    <path d="M52 -36 L94 -80" stroke="#1E2749" stroke-width="6" stroke-linecap="round" />
    <path d="M52 -36 L94 -80" stroke="#FAFAFF" stroke-width="2" stroke-linecap="round" />

    <!-- Mound of berries, banana slices & granola -->
    <ellipse cx="0" cy="-36" rx="88" ry="26" fill="#575E8F" stroke="#1E2749" stroke-width="3" />
    <ellipse cx="-52" cy="-34" rx="16" ry="11" transform="rotate(-18 -52 -34)" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.2" />
    <circle cx="-52" cy="-34" r="2" fill="#30343F" />
    <circle cx="-26" cy="-48" r="14" fill="#8687B4" stroke="#1E2749" stroke-width="2.4" />
    <circle cx="-22" cy="-52" r="4" fill="#FAFAFF" />
    <circle cx="0" cy="-55" r="16" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.6" />
    <circle cx="4" cy="-59" r="4.5" fill="#FAFAFF" />
    <circle cx="28" cy="-49" r="14" fill="#575E8F" stroke="#1E2749" stroke-width="2.4" />
    <circle cx="52" cy="-42" r="12" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.2" />

    <!-- Ceramic bowl vessel with carved woodcut hatching -->
    <path d="M-94 -34 C-92 26 -54 58 0 60 C54 58 92 26 94 -34 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="3.4" stroke-linejoin="round" />
    <path d="M-34 57 L-28 70 L28 70 L34 57" fill="#575E8F" stroke="#1E2749" stroke-width="3" stroke-linejoin="round" />
    <path d="M12 -34 C38 -2 36 32 10 56 C48 52 84 22 92 -34 Z" fill="url(#topping-hatch)" opacity="0.62" />
    <path d="M-76 -16 Q0 2 76 -16" stroke="#1E2749" stroke-width="2" fill="none" />
  </g>

  <!-- 2. HONEY DIPPER & HEXAGONAL HONEYCOMB (x ~ 410) -->
  <g id="woodcut-honey-dipper" transform="translate(410, 152)">
    <g fill="#E4D9FF" stroke="#1E2749" stroke-width="2.4" stroke-linejoin="round">
      <polygon points="10,48 24,40 38,48 38,64 24,72 10,64" />
      <polygon points="38,48 52,40 66,48 66,64 52,72 38,64" />
      <polygon points="24,72 38,64 52,72 52,88 38,96 24,88" />
      <polygon points="52,72 66,64 80,72 80,88 66,96 52,88" />
      <polygon points="-4,72 10,64 24,72 24,88 10,96 -4,88" />
    </g>
    <g fill="#575E8F">
      <circle cx="24" cy="56" r="6" />
      <circle cx="52" cy="56" r="6" />
      <circle cx="38" cy="80" r="6" />
      <circle cx="66" cy="80" r="5" />
    </g>
    <path d="M-24 22 C-24 38 -26 52 -16 58 C-8 62 -10 42 -8 24 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.4" />
    <circle cx="-16" cy="74" r="6" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.2" />
    <g transform="rotate(-30)">
      <rect x="-112" y="-7" width="84" height="14" rx="7" fill="#8687B4" stroke="#1E2749" stroke-width="2.8" />
      <line x1="-102" y1="-2" x2="-40" y2="-2" stroke="#FAFAFF" stroke-width="1.4" />
      <rect x="-32" y="-22" width="12" height="44" rx="5" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.6" />
      <rect x="-18" y="-26" width="12" height="52" rx="5" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.6" />
      <rect x="-4" y="-27" width="12" height="54" rx="5" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.6" />
      <rect x="10" y="-24" width="12" height="48" rx="5" fill="#575E8F" stroke="#1E2749" stroke-width="2.6" />
      <rect x="24" y="-18" width="10" height="36" rx="5" fill="#1E2749" />
    </g>
  </g>

  <!-- 3. ORGANIC GRANOLA CLUSTERS & ROLLED OATS (x ~ 625, top) -->
  <g id="woodcut-granola" transform="translate(625, 100)">
    <!-- Bumpy toasted granola cluster 1 -->
    <path d="M-46 8 C-48 -6 -36 -18 -20 -16 C-8 -22 8 -14 10 -2 C14 12 4 24 -12 24 C-28 28 -44 20 -46 8 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.6" />
    <!-- Bumpy toasted granola cluster 2 -->
    <path d="M6 -12 C6 -26 22 -34 36 -26 C48 -24 54 -10 48 4 C44 16 26 20 14 14 C6 8 4 -2 6 -12 Z" fill="#8687B4" stroke="#1E2749" stroke-width="2.6" />
    <!-- Organic rolled oat flakes & seed scatter -->
    <ellipse cx="-52" cy="-16" rx="13" ry="7" transform="rotate(-24 -52 -16)" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.2" />
    <ellipse cx="48" cy="24" rx="14" ry="7.5" transform="rotate(24 48 24)" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.2" />
    <ellipse cx="-16" cy="36" rx="13" ry="7" transform="rotate(10 -16 36)" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.2" />
    <ellipse cx="14" cy="32" rx="12" ry="6.5" transform="rotate(-16 14 32)" fill="#575E8F" stroke="#1E2749" stroke-width="2.2" />
    <ellipse cx="-38" cy="30" rx="10" ry="6" transform="rotate(32 -38 30)" fill="#FAFAFF" stroke="#1E2749" stroke-width="2" />
    <!-- Oat creases & chia stipples -->
    <path d="M-28 4 L-10 0 M18 -14 L34 -8 M-20 36 L-12 36" stroke="#1E2749" stroke-width="1.8" stroke-linecap="round" />
    <g fill="#1E2749">
      <circle cx="-6" cy="-6" r="2.2" />
      <circle cx="24" cy="-2" r="2.2" />
      <circle cx="34" cy="36" r="2" />
      <circle cx="-54" cy="18" r="2" />
    </g>
  </g>

  <!-- 4. CURLED COCONUT SHAVINGS (x ~ 835, top) -->
  <g id="woodcut-coconut" transform="translate(835, 102)">
    <path d="M-56 -8 C-34 -30 8 -26 24 -4 C4 -8 -24 -2 -44 12 Z" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.8" stroke-linejoin="round" />
    <path d="M-32 16 C-8 -6 34 -4 52 22 C28 16 -4 20 -20 34 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.8" stroke-linejoin="round" />
    <path d="M-10 -34 C18 -44 50 -30 58 -8 C34 -20 12 -22 -10 -34 Z" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M-32 16 C-12 2 18 0 42 12" stroke="#575E8F" stroke-width="3" fill="none" />
    <path d="M-50 -4 C-32 -18 -8 -18 14 -6" stroke="#8687B4" stroke-width="2.2" fill="none" />
    <path d="M2 -28 C20 -34 38 -26 48 -14" stroke="#8687B4" stroke-width="1.8" fill="none" />
  </g>

  <!-- 5. PUMPKIN SEEDS / PEPITAS (x ~ 625, bottom) -->
  <g id="woodcut-pumpkin-seeds" transform="translate(625, 224)">
    <g transform="rotate(-24 -32 -10)">
      <path d="M-32 -28 C-20 -18 -18 2 -32 12 C-46 2 -44 -18 -32 -28 Z" fill="#575E8F" stroke="#1E2749" stroke-width="2.6" />
      <path d="M-32 -20 L-32 4" stroke="#E4D9FF" stroke-width="1.6" />
    </g>
    <g transform="rotate(18 4 0)">
      <path d="M4 -20 C16 -8 18 12 4 24 C-10 12 -8 -8 4 -20 Z" fill="#8687B4" stroke="#1E2749" stroke-width="2.6" />
      <path d="M4 -12 L4 14" stroke="#FAFAFF" stroke-width="1.6" />
    </g>
    <g transform="rotate(42 42 12)">
      <path d="M42 -8 C54 4 56 24 42 36 C28 24 30 4 42 -8 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.6" />
      <path d="M42 0 L42 26" stroke="#1E2749" stroke-width="1.6" />
    </g>
  </g>

  <!-- 6. ALMONDS WHOLE & SLIVERED (x ~ 835, bottom) -->
  <g id="woodcut-almonds" transform="translate(835, 224)">
    <g transform="rotate(-18 -24 0)">
      <path d="M-24 -28 C-6 -14 -4 14 -24 28 C-44 14 -42 -14 -24 -28 Z" fill="#575E8F" stroke="#1E2749" stroke-width="2.8" />
      <path d="M-24 -18 C-28 -4 -28 10 -24 20 M-17 -10 C-14 0 -14 10 -18 16 M-31 -8 C-34 2 -34 10 -30 16" stroke="#FAFAFF" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
    <g transform="rotate(24 18 -6)">
      <path d="M18 -26 C30 -12 30 12 18 24 C6 12 6 -12 18 -26 Z" fill="#FAFAFF" stroke="#1E2749" stroke-width="2.6" />
      <path d="M18 -18 L18 16" stroke="#8687B4" stroke-width="1.4" />
    </g>
    <g transform="rotate(64 46 18)">
      <path d="M46 -4 C56 8 56 24 46 34 C36 24 36 8 46 -4 Z" fill="#E4D9FF" stroke="#1E2749" stroke-width="2.4" />
    </g>
  </g>

  </g>
</svg>
